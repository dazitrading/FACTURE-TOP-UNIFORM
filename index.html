<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Factures TU">
<meta name="theme-color" content="#0070C0">
<title>Factures TOP UNIFORM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{--ink:#0b1f3a;--blue:#0070C0;--line:#dfe4ee;--muted:#6b7895;--amber:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef2fa,#f4f6fb);min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 80px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif}
.btn{cursor:pointer;border:none;border-radius:10px;font-weight:600;transition:.15s;font-family:inherit;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--blue);color:#fff}.btn-pri:disabled{opacity:.45;cursor:not-allowed}
.btn-gho{background:#fff;color:var(--blue);border:1.5px solid var(--line)}.btn-gho:hover{border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px -20px rgba(11,31,58,.4);padding:16px;margin-bottom:14px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:14px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--blue)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.tag{display:inline-flex;gap:6px;background:#e8f1fb;color:var(--blue);border:1px solid #cfe2f7;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse}
.drop{border:2px dashed #c3cee4;border-radius:12px;background:#fbfcff;display:flex;flex-direction:column;align-items:center;padding:26px 14px;cursor:pointer;text-align:center}
.drop:hover{border-color:var(--blue)}
.spin{width:16px;height:16px;border:2.5px solid #ffffff60;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.err{margin-top:10px;color:var(--amber);font-size:13px;background:#fff7ed;border:1px solid #fcd9a8;border-radius:8px;padding:8px 11px}
.fac{background:#fff;color:#000;font-family:'IBM Plex Sans',sans-serif;padding:28px 30px}
.fac .brand{font-size:34px;font-weight:700;color:var(--blue);line-height:1}
.fac .sub{font-size:12px;font-weight:700;margin-top:2px}
.fbox td{border:1px solid #000;padding:5px 8px;font-size:13px}
.ltab th{border:1px solid #000;padding:5px 6px;font-size:12px;background:#f2f2f2}
.ltab td{border:1px solid #000;padding:5px 6px;font-size:13px;height:24px}
.foot{font-size:11px;margin-top:26px;line-height:1.5}
@media print{body *{visibility:hidden}#fac,#fac *{visibility:visible}#fac{position:absolute;inset:0;margin:0}.noprint{display:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ====== À CONFIGURER : colle ici l'URL /exec de ton relais Apps Script ====== -->
  <script>
    const RELAY_URL = "https://script.google.com/macros/s/AKfycbxEHjO88GS4Hj_zm_soQt1gLDquIEa4HTtnLh4WHctxJrBWKOO3HLpR9pMgXxAwMzIj/exec"; // ex: https://script.google.com/macros/s/xxxx/exec
  </script>
  <!-- =========================================================================== -->

  <div class="noprint" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:24px;font-weight:700;color:var(--blue)">TOP UNIFORM</div>
      <div style="color:var(--muted);font-size:13px">BL manuscrit → Facture TTC</div>
    </div>
    <div class="tag mono" style="gap:4px;align-items:center">Prochaine N°&nbsp;<input id="nextN" type="number" min="1" style="width:62px;border:1px solid #cfe2f7;border-radius:6px;padding:2px 5px;font-family:inherit;font-weight:600;color:var(--blue);text-align:center">-<span id="yy"></span></div>
  </div>

  <div id="keyWarn" class="card noprint hide" style="background:#fff7ed;border-color:#fcd9a8">
    ⚠️ Relais non configuré. Ouvre <b>index.html</b> et colle l'URL <span class="mono">/exec</span> dans <span class="mono">RELAY_URL</span>.
  </div>

  <div id="photo" class="card noprint">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>1 · Photo du BL</b><span id="blTag" class="tag hide"></span>
    </div>
    <input id="file" type="file" accept="image/*" class="hide">
    <div id="dropBox" class="drop">
      <div style="font-size:30px">📷</div>
      <div id="dropTxt" style="font-weight:600">Prendre une photo / importer</div>
      <div style="color:var(--muted);font-size:12px;margin-top:3px">cadre bien, bonne lumière</div>
      <button class="btn btn-pri" style="margin-top:14px;padding:9px 18px" id="pickBtn">Choisir une image</button>
    </div>
    <div id="preview" class="hide" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <img id="prevImg" alt="" style="width:130px;border-radius:8px;border:1px solid var(--line)">
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-pri" id="readBtn" style="padding:10px 16px"></button>
        <button class="btn btn-gho" id="changeBtn" style="padding:8px 14px;font-size:13px">Changer</button>
      </div>
    </div>
    <div id="err" class="err hide"></div>
  </div>

  <div id="edit" class="card noprint hide">
    <b>2 · Vérifie et corrige</b>
    <div class="grid2">
      <div><label class="lbl">Client</label><input class="inp ar" id="f_client"></div>
      <div><label class="lbl">ICE</label><input class="inp mono" id="f_ice"></div>
      <div><label class="lbl">Réf BL</label><input class="inp" id="f_ref"></div>
      <div><label class="lbl">Date</label><input class="inp" id="f_date"></div>
    </div>
    <table>
      <thead><tr style="font-size:11px;color:var(--muted);text-transform:uppercase">
        <th style="text-align:left;padding:6px">Désignation</th><th style="padding:6px">Q</th>
        <th style="padding:6px">PU TTC</th><th style="text-align:right;padding:6px">P T TTC</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-gho" id="addLine" style="padding:7px 12px;font-size:13px">+ Ligne</button>
      <button class="btn btn-gho" id="addBL" style="padding:7px 12px;font-size:13px">📷 Ajouter un autre BL</button>
    </div>
    <div style="text-align:right;margin-top:14px;line-height:1.6" class="mono">
      <div style="font-size:17px;font-weight:700;color:var(--blue)">PRIX T.TTC : <span id="tTtc">0,00</span> DH</div>
      <div style="font-size:13px;color:var(--muted)">DONT TVA 20% : <span id="tTva">0,00</span> DH</div>
    </div>
    <button class="btn btn-pri" id="genBtn" style="width:100%;margin-top:12px;padding:12px;font-size:15px" disabled>Générer la facture →</button>
  </div>

  <div id="facBar" class="noprint hide" style="display:flex;justify-content:space-between;margin:18px 2px 8px;flex-wrap:wrap;gap:8px">
    <span class="tag mono" id="facNum"></span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-gho" id="newBtn" style="padding:9px 14px">+ Nouvelle</button>
      <button class="btn btn-pri" id="printBtn" style="padding:9px 16px">⬇︎ Imprimer / PDF</button>
    </div>
  </div>
  <div id="fac" class="fac card hide"></div>

</div>

<script>
const CO = {
  sub: "Equipements de protection individuelles et vêtements de travail",
  addr: "STE TOP UNIFORM MAG 2 RUE BNI OUKIL HY EL AMAL N 23 RTE SEFROU Fés",
  gsm: "GSM : 06 65 99 44 39",
  legal: "RC : 72609 - TP : 14204244 - IF : 52457050 - ICE : 003027844000006",
};
const $ = (id) => document.getElementById(id);
const fmt = (n) => (Number(n)||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const todayFR = () => new Date().toLocaleDateString("fr-FR");
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = { img:null, busy:false, num:null,
  next: Number(localStorage.getItem("tu_next")||117),
  doc: { client:"", ice:"", ref:"", date: todayFR(), lines:[], bl:0 } };

function calc(){ const ttc = state.doc.lines.reduce((s,l)=> s+(Number(l.qte)||0)*(Number(l.pu)||0),0); return {ttc, tva: ttc/6}; }
function updateCounter(){ const yy=String(new Date().getFullYear()).slice(-2); const el=$("nextN"); if(el && document.activeElement!==el) el.value=state.next; const y=$("yy"); if(y) y.textContent=yy; }
function showErr(m){ const e=$("err"); if(!m){e.classList.add("hide");return;} e.textContent=m; e.classList.remove("hide"); }

$("pickBtn").onclick = (e)=>{ e.stopPropagation(); $("file").click(); };
$("dropBox").onclick = ()=> $("file").click();
$("changeBtn").onclick = ()=>{ state.img=null; $("file").value=""; $("preview").classList.add("hide"); $("dropBox").classList.remove("hide"); };
$("file").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return; showErr(""); hideFacture();
  const r = new FileReader();
  r.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const MAX=1568; let w=im.width,h=im.height;
      if(Math.max(w,h)>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      const url=c.toDataURL("image/jpeg",0.78);
      state.img={ data:url.split(",")[1], mime:"image/jpeg", url };
      $("prevImg").src=url; $("dropBox").classList.add("hide"); $("preview").classList.remove("hide");
      $("readBtn").innerHTML = state.doc.bl>0 ? "🔍 Lire et ajouter" : "🔍 Lire le BL";
    };
    im.onerror = ()=>{ state.img={ data:r.result.split(",")[1], mime:f.type||"image/jpeg", url:r.result }; $("prevImg").src=r.result; $("dropBox").classList.add("hide"); $("preview").classList.remove("hide"); $("readBtn").innerHTML="🔍 Lire le BL"; };
    im.src=r.result;
  };
  r.readAsDataURL(f);
};

$("readBtn").onclick = async ()=>{
  if(!state.img || state.busy) return;
  if(!RELAY_URL || RELAY_URL==="COLLE_TON_URL_EXEC_ICI"){ $("keyWarn").classList.remove("hide"); showErr("Configure l'URL du relais dans le fichier."); return; }
  state.busy=true; $("readBtn").innerHTML='<span class="spin"></span>Lecture…'; showErr("");
  try{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),75000);
    const res=await fetch(RELAY_URL,{
      method:"POST", signal:ctrl.signal,
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ img:{ data:state.img.data, mime:state.img.mime } })
    });
    clearTimeout(timer);
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||"relais");
    const p=j.data||{};
    const inc=(Array.isArray(p.lines)&&p.lines.length)? p.lines.map(l=>({designation:l.designation||"",qte:Number(l.qte)||0,pu:Number(l.pu)||0})) : [];
    const kept=state.doc.lines.filter(l=>String(l.designation).trim()!=="");
    const refs=[...new Set([state.doc.ref,p.ref].map(x=>(x||"").trim()).filter(Boolean))];
    state.doc.client = state.doc.client || p.client || "";
    state.doc.ice    = state.doc.ice    || p.ice    || "";
    state.doc.ref    = refs.join(" + ");
    state.doc.date   = state.doc.date   || p.date   || todayFR();
    state.doc.lines  = [...kept,...inc].length ? [...kept,...inc] : [{designation:"",qte:1,pu:0}];
    state.doc.bl     = (state.doc.bl||0)+1;
    state.img=null; $("file").value="";
    $("preview").classList.add("hide"); $("dropBox").classList.remove("hide");
    $("dropTxt").textContent="Ajouter le BL suivant";
    $("blTag").textContent=state.doc.bl+" BL lu"+(state.doc.bl>1?"s":""); $("blTag").classList.remove("hide");
    renderEdit();
  }catch(e){
    showErr(e.name==="AbortError" ? "Délai dépassé. Réessaie, ou recadre la photo (juste le tableau du BL)." : "Lecture impossible ("+(e.message||"erreur")+"). Reprends la photo nette, ou saisis à la main.");
    if(!state.doc.lines.length){ state.doc.lines=[{designation:"",qte:1,pu:0}]; renderEdit(); }
  }finally{ state.busy=false; $("readBtn").innerHTML = state.doc.bl>0 ? "🔍 Lire et ajouter" : "🔍 Lire le BL"; }
};

function renderEdit(){
  $("edit").classList.remove("hide");
  $("f_client").value=state.doc.client; $("f_ice").value=state.doc.ice;
  $("f_ref").value=state.doc.ref; $("f_date").value=state.doc.date;
  const rows=$("rows"); rows.innerHTML="";
  state.doc.lines.forEach((l,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=
      '<td style="padding:4px"><input class="inp ar" data-i="'+i+'" data-k="designation" value="'+esc(l.designation)+'"></td>'+
      '<td style="padding:4px"><input class="inp mono" style="width:62px" type="number" data-i="'+i+'" data-k="qte" value="'+(l.qte)+'"></td>'+
      '<td style="padding:4px"><input class="inp mono" style="width:84px" type="number" data-i="'+i+'" data-k="pu" value="'+(l.pu)+'"></td>'+
      '<td class="mono" style="text-align:right;font-weight:600;white-space:nowrap;padding-right:6px" id="lt'+i+'">'+fmt(l.qte*l.pu)+'</td>'+
      '<td><button class="btn" data-del="'+i+'" style="background:none;color:#c0392b;font-size:17px">×</button></td>';
    rows.appendChild(tr);
  });
  rows.querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{ const i=+inp.dataset.i,k=inp.dataset.k; state.doc.lines[i][k]= k==="designation"?inp.value:Number(inp.value); const l=state.doc.lines[i]; const c=$("lt"+i); if(c)c.textContent=fmt((l.qte||0)*(l.pu||0)); updateTotals(); };
  });
  rows.querySelectorAll("[data-del]").forEach(b=>{ b.onclick=()=>{ state.doc.lines.splice(+b.dataset.del,1); renderEdit(); }; });
  updateTotals();
}
$("f_client").oninput=()=>{ state.doc.client=$("f_client").value; updateTotals(); };
$("f_ice").oninput=()=>{ state.doc.ice=$("f_ice").value; };
$("f_ref").oninput=()=>{ state.doc.ref=$("f_ref").value; };
$("f_date").oninput=()=>{ state.doc.date=$("f_date").value; };
$("nextN").oninput=()=>{ const v=parseInt($("nextN").value,10); state.next=(v>0?v:1); localStorage.setItem("tu_next",String(state.next)); };
function updateTotals(){ const t=calc(); $("tTtc").textContent=fmt(t.ttc); $("tTva").textContent=fmt(t.tva);
  const ok = state.doc.client.trim() && state.doc.lines.some(l=>l.designation && l.qte>0); $("genBtn").disabled=!ok; }
$("addLine").onclick=()=>{ state.doc.lines.push({designation:"",qte:1,pu:0}); renderEdit(); };
$("addBL").onclick=()=>{ state.img=null; $("file").value=""; $("preview").classList.add("hide"); $("dropBox").classList.remove("hide"); $("photo").scrollIntoView({behavior:"smooth"}); };

function hideFacture(){ $("fac").classList.add("hide"); $("facBar").classList.add("hide"); }
$("genBtn").onclick=()=>{
  const n=state.next, yy=String(new Date().getFullYear()).slice(-2);
  state.num=n+"-"+yy; state.next=n+1; localStorage.setItem("tu_next",String(state.next)); updateCounter();
  const t=calc(); const lines=state.doc.lines.filter(l=>l.designation);
  let rows=lines.map(l=>'<tr><td></td><td></td><td style="text-align:center">'+l.qte+'</td><td class="ar">'+esc(l.designation)+'</td><td style="text-align:right" class="mono">'+fmt(l.pu)+'</td><td style="text-align:right" class="mono">'+fmt(l.qte*l.pu)+'</td></tr>').join("");
  for(let i=lines.length;i<6;i++) rows+='<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
  $("fac").innerHTML=
    '<div class="brand">TOP UNIFORM</div><div class="sub">'+CO.sub+'</div>'+
    '<table class="fbox" style="margin-top:18px;width:100%"><tbody>'+
    '<tr><td style="width:45%;font-weight:700">FACTURE N° '+state.num+'</td><td>CLIENT : <span class="ar">'+esc(state.doc.client)+'</span></td></tr>'+
    '<tr><td style="font-weight:700">DATE : '+esc(state.doc.date)+'</td><td>ICE&nbsp;&nbsp;&nbsp;: '+esc(state.doc.ice)+'</td></tr>'+
    '</tbody></table>'+
    '<table class="ltab" style="margin-top:16px"><thead><tr><th>BC N°</th><th>BL N°</th><th>Q</th><th style="width:42%">DESIGNATION</th><th>PU TTC</th><th>P T TTC</th></tr></thead><tbody>'+
    rows+
    '<tr><td colspan="4" style="border:none"></td><td style="font-weight:700">PRIX T.TTC</td><td style="text-align:right;font-weight:700" class="mono">'+fmt(t.ttc)+'</td></tr>'+
    '<tr><td colspan="4" style="border:none"></td><td style="font-weight:700">DONT TVA 20%</td><td style="text-align:right" class="mono">'+fmt(t.tva)+'</td></tr>'+
    '</tbody></table>'+
    '<div class="foot"><b>'+CO.addr+'</b><br>'+CO.gsm+'<br>'+CO.legal+'</div>';
  $("facNum").textContent="FACTURE N° "+state.num;
  $("fac").classList.remove("hide"); $("facBar").classList.remove("hide");
  setTimeout(()=>$("fac").scrollIntoView({behavior:"smooth"}),50);
};
$("printBtn").onclick=()=>window.print();
$("newBtn").onclick=()=>{ state.doc={client:"",ice:"",ref:"",date:todayFR(),lines:[],bl:0}; state.num=null; state.img=null;
  $("file").value=""; $("edit").classList.add("hide"); hideFacture(); $("blTag").classList.add("hide");
  $("dropTxt").textContent="Prendre une photo / importer"; $("preview").classList.add("hide"); $("dropBox").classList.remove("hide");
  showErr(""); window.scrollTo({top:0,behavior:"smooth"}); };

updateCounter();
if(!RELAY_URL || RELAY_URL==="COLLE_TON_URL_EXEC_ICI") $("keyWarn").classList.remove("hide");
</script>
</body>
</html>
